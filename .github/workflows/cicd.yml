name: Deploy STVbotGo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy STVbotGo
        uses: actions/checkout@v4
      - name: Create .evn file
        run: echo "TOKEN=${{ secrets.TOKEN }}" >> .env
      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        run: docker build -t maksim6opka/stvbotgo .
      - name: Push Docker image
        run: docker push maksim6opka/stvbotgo:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull maksim6opka/stvbotgo:latest

      - name: Delete old Docker container
        run: docker rm -f STVbotGo || true

      - name: Run Docker container
        run: docker run -d -p 1234:1234 --name STVbotGo  maksim6opka/stvbotgo:latest