name: Deploy STVbotGo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy STVbotGo
        uses: actions/checkout@v4
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t maksim6opka/stvbotgo:latest .

      - name: Push Docker image
        run: docker push maksim6opka/stvbotgo:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull Docker image
        run: docker pull maksim6opka/stvbotgo:latest

      - name: Delete old Docker container
        run: docker rm -f STVbotGo || true

      - name: Run Docker container
        run: docker run -d --restart unless-stopped -p 1234:1234 --name STVbotGo -e TOKEN="${{ secrets.TOKEN }}" maksim6opka/stvbotgo:latest