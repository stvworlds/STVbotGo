name: Deploy STVbotGo

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/stevious-xyz/stvbotgo
  IMAGE_TAG: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy STVbotGo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Debug GHCR access
        run: |
          docker logout ghcr.io || true
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
          docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Pull Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Delete old Docker container
        run: docker rm -f STVbotGo || true

      - name: Run Docker container
        run: docker run -d --restart unless-stopped -p 1234:1234 --name STVbotGo -e APP_CONFIG=main -e TOKEN="${{ secrets.TOKEN }}" ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}