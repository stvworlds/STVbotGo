name: Deploy dev STVbotGo

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/stevious-xyz/stvbotgo
  IMAGE_TAG: dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Debug GHCR access
        run: |
          docker logout ghcr.io || true
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
          docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Pull Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Delete old Docker container
        run: docker rm -f STVbotGoDev || true

      - name: Run Docker container
        run: sudo ufw disable | docker run -d --restart unless-stopped -p 1235:1234 --name STVbotGoDev -e APP_CONFIG=dev -e TOKEN="${{ secrets.DEV_TOKEN }}" ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}