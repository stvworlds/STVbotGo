name: Deploy STVbotGo

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/stevious-xyz/stvbotgo
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy dev STVbotGo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Login to dev GitHub Packages Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull dev Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Delete old dev Docker container
        run: docker rm -f STVbotGo || true

      - name: Run dev Docker container
        run: docker run -d --restart unless-stopped -p 1234:1234 --name STVbotGo -e TOKEN="${{ secrets.DEV_TOKEN }}" ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}